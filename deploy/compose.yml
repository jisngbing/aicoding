name: aicoding
services:
  backend:
    image: aicoding-backend:linux
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env-linux
    environment:
      HOME: /home/app
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../ai_workspace:/app/ai_workspace
    networks:
      - app
      - databases
    mem_limit: 768m
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      options:
        max-size: 10m
        max-file: '3'
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ../ui/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
    mem_limit: 64m
    logging:
      options:
        max-size: 10m
        max-file: '3'
networks:
  app:
  databases:
    external: true
    name: rag-databases_default
